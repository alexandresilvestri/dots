# Shell
set-option -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Mode
set-window-option -g mode-keys vi

# Prefix
unbind M-b
set-option -g prefix M-q
bind M-q send-prefix

# Mouse enable
set-option -g mouse on
 
# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"
bind-key -n C-Left send-keys M-b
bind-key -n C-Right send-keys M-f

# Split panel
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window
bind t new-window -c "#{pane_current_path}"

# Create temp window for lazydocker, lazygit and claude
bind d popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazydocker"
bind g popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind c popup -E -w 90% -h 90% -d "#{pane_current_path}" "$HOME/.local/bin/claude"
bind a popup -E -w 90% -h 90% -d "$HOME"
bind p popup -E -w 90% -h 90% -d "#{pane_current_path}" "make pgcli"
bind r popup -E -w 90% -h 90% -d "#{pane_current_path}" "iredis"

# Set history limit
set -g history-limit 10000

# Dim inactive panes
 set-option -g window-style 'bg=#242424'
 set-option -g window-active-style 'bg=#000000'

# Set index pane
set -g base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'tmux-plugins/tmux-continuum'

# autosave session
set -g @continuum-restore 'on'

# Changes on Tmux2k 
set -g @tmux2k-icons 'true'
set -g @tmux2k-right-plugins "cpu ram time"
set -g @tmux2k-white '#ececec'
set -g @tmux2k-dark-gray '#1a1a1a'
set -g @tmux2k-blue '#8d8d8d'
set -g @tmux2k-light-blue '#b0b0b0'
set -g @tmux2k-green '#b6b6b6'
set -g @tmux2k-light-green '#cecece'
set -g @tmux2k-yellow '#a4a4a4'
set -g @tmux2k-red '#7a7a7a'
set -g @tmux2k-prefix-highlight '#ffffff'
set -g @tmux2k-pane-border '#000000'

# Initialize plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'
